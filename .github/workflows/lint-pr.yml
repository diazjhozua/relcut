name: relcut / lint-pr

on:
  workflow_call:
    inputs:
      types:
        description: >-
          Newline-delimited list of allowed commit types. Defaults to the
          conventional-commit types release-please understands.
        type: string
        default: |
          feat
          fix
          perf
          deps
          docs
          test
          build
          ci
          chore
          refactor
          revert

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title is a conventional commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.types }}
