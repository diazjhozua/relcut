name: relcut

on:
  workflow_call:
    inputs:
      release-type:
        description: "release-please release type (simple, node, python, go, etc.)"
        type: string
        default: simple
      target-branch:
        description: "Branch to open release PRs against"
        type: string
        default: main
      update-major-tag:
        description: "Keep a moving major tag (e.g. v1) pointing at the latest release"
        type: boolean
        default: true
    outputs:
      release_created:
        description: "Whether a GitHub release was created in this run"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "The tag of the created release (e.g. v1.2.3)"
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: "The version of the created release (e.g. 1.2.3)"
        value: ${{ jobs.release-please.outputs.version }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: ${{ inputs.release-type }}
          target-branch: ${{ inputs.target-branch }}

  update-major-tag:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && inputs.update-major-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move major tag to latest release
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          major="${TAG_NAME%%.*}"
          git tag -f "$major" "$TAG_NAME"
          git push origin "$major" --force

