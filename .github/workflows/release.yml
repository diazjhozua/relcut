name: relcut

on:
  workflow_call:
    inputs:
      release-type:
        description: "release-please release type (simple, node, python, go, etc.)"
        type: string
        default: simple
      target-branch:
        description: "Branch to open release PRs against"
        type: string
        default: main
      update-major-tag:
        description: "Keep a moving major tag (e.g. v1) pointing at the latest release"
        type: boolean
        default: true
      config-file:
        description: "Path to a release-please config file (for custom changelog sections, monorepos, etc.)"
        type: string
        default: release-please-config.json
      manifest-file:
        description: "Path to the release-please manifest file tracking released versions"
        type: string
        default: .release-please-manifest.json
    secrets:
      release-token:
        description: >-
          Token used to create release PRs, tags, and releases. Defaults to
          GITHUB_TOKEN, which cannot trigger downstream workflows (e.g.
          on: push: tags). Pass a PAT or GitHub App token if you chain
          workflows off releases.
        required: false
    outputs:
      release_created:
        description: "Whether a GitHub release was created in this run"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "The tag of the created release (e.g. v1.2.3)"
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: "The version of the created release (e.g. 1.2.3)"
        value: ${{ jobs.release-please.outputs.version }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    concurrency:
      group: relcut-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.release-token || github.token }}
          release-type: ${{ inputs.release-type }}
          target-branch: ${{ inputs.target-branch }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

  update-major-tag:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && inputs.update-major-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.release-token || github.token }}
      - name: Move major tag to latest release
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          major="${TAG_NAME%%.*}"
          git tag -f "$major" "$TAG_NAME"
          git push origin "$major" --force

