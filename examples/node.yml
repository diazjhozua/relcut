# Node projects: bumps the version in package.json.
# Save as .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: diazjhozua/relcut/.github/workflows/release.yml@v1
    with:
      release-type: node
