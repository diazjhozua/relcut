# Chain a publish job that runs only when a release was actually cut.
# IMPORTANT: pass a PAT (or GitHub App token) as release-token if you instead
# want separate workflows triggered by the tag/release — the default
# GITHUB_TOKEN cannot trigger other workflows.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: diazjhozua/relcut/.github/workflows/release.yml@v1
    with:
      release-type: simple
    secrets:
      release-token: ${{ secrets.RELEASE_PAT }}

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Build and publish
        run: echo "Publishing ${{ needs.release.outputs.version }}"
